<!-- =========================================================
     MOBILE TOP HEADER BAR
     ========================================================= -->

<header class="mobile-header">
  <button
    class="mobile-menu-toggle"
    id="mobileMenuToggle"
    aria-label="Open Navigation Menu"
  >
    <i class="fa-solid fa-bars"></i>
  </button>
</header>

<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<aside class="sidebar" id="sidebar">
  <!-- DESKTOP TOGGLE BUTTON -->
  <button class="toggle-btn" id="sidebarToggle" aria-label="Toggle Navigation">
    <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
  </button>

  <!-- =======================================================
       SIDEBAR TOP
       ======================================================= -->

  <div class="sidebar-top">
    <!-- CLINIC BRAND -->
    <div class="sidebar-brand">
      <div class="brand-logo-text">DN</div>

      <div class="brand-title">
        <span>DentaNueva</span>
        <small>Dental Clinic</small>
      </div>
    </div>

    <!-- =====================================================
         NAVIGATION MENU
         ===================================================== -->

    <nav class="sidebar-menu">
      <!-- DASHBOARD -->
      <a
        href="/staff/dashboard/dashboard.html"
        class="menu-item"
        data-page="dashboard"
        title="Dashboard"
      >
        <i class="fa-solid fa-border-all"></i>

        <span class="menu-text"> Dashboard </span>
      </a>

      <!-- APPOINTMENT -->
      <a
        href="/staff/appointment/appointment.html"
        class="menu-item"
        data-page="appointment"
        title="Appointment"
      >
        <i class="fa-regular fa-calendar-check"></i>

        <span class="menu-text"> Appointment </span>
      </a>

      <!-- PATIENTS -->
      <a href="/staff/" class="menu-item" data-page="patients" title="Patients">
        <i class="fa-solid fa-user-doctor"></i>

        <span class="menu-text"> Patients </span>
      </a>

      <!-- INVENTORY -->
      <a
        href="/staff/inventory/inventory.html"
        class="menu-item"
        data-page="inventory"
        title="Inventory"
      >
        <i class="fa-solid fa-boxes-stacked"></i>

        <span class="menu-text"> Inventory </span>
      </a>

      <!-- SMS -->
      <a
        href="/staff/sms_notifications/sms_notifications.html"
        class="menu-item"
        data-page="sms"
        title="SMS"
      >
        <i class="fa-regular fa-comment-dots"></i>

        <span class="menu-text"> SMS </span>
      </a>

      <!-- FINANCE -->
      <a
        href="/staff/finance/finance.html"
        class="menu-item"
        data-page="finance"
        title="Finance"
      >
        <i class="fa-regular fa-credit-card"></i>

        <span class="menu-text"> Finance </span>
      </a>

      <!-- MOBILE LOGOUT -->
      <a
        href="#logout"
        class="menu-item btn-logout btn-logout-mobile"
        id="logoutTriggerBtnMobile"
        title="Logout"
      >
        <i class="fa-solid fa-right-from-bracket logout-icon"></i>

        <span class="logout-text"> Logout </span>
      </a>
    </nav>
  </div>

  <!-- =======================================================
       SIDEBAR FOOTER
       ======================================================= -->

  <div class="sidebar-footer">
    <!-- =====================================================
         LOGOUT
         ===================================================== -->

    <a href="#logout" class="btn-logout" id="logoutTriggerBtn" title="Logout">
      <i class="fa-solid fa-right-from-bracket logout-icon"></i>

      <span class="logout-text"> Logout </span>
    </a>

    <!-- =====================================================
         DIVIDER
         ===================================================== -->

    <div class="sidebar-footer-divider"></div>

    <!-- =====================================================
         ACTIVE STAFF
         ===================================================== -->

    <div class="sidebar-staff-profile">
      <!-- STAFF PHOTO / INITIALS -->
      <div class="sidebar-staff-avatar">
        <img id="activeStaffImage" src="" alt="Staff profile" />

        <span id="activeStaffInitials"> EJ </span>
      </div>

      <!-- STAFF INFORMATION -->
      <div class="sidebar-staff-info">
        <span class="sidebar-staff-name" id="activeStaffName">
          Erwin Jacaba
        </span>

        <span class="sidebar-staff-status">
          <span class="staff-status-dot"></span>

          Active now
        </span>
      </div>
    </div>
  </div>
</aside>

<!-- =========================================================
     MOBILE SIDEBAR OVERLAY
     ========================================================= -->

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- =========================================================
     LOGOUT CONFIRMATION MODAL
     ========================================================= -->

<div class="logout-modal-backdrop" id="logoutModalBackdrop">
  <div class="logout-modal-card">
    <div class="logout-modal-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <h3>Ready to Leave?</h3>

    <p>Are you sure you want to log out of your session?</p>

    <div class="logout-modal-actions">
      <button type="button" class="btn-modal-cancel" id="logoutCancelBtn">
        Cancel
      </button>

      <button type="button" class="btn-modal-confirm" id="logoutConfirmBtn">
        Yes, Log Out
      </button>
    </div>
  </div>
</div>
